name: TestFlight
run-name: TestFlight ${{ github.event.release.tag_name || inputs.release_tag }}

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vMAJOR.MINOR.PATCH release tag to redeploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testflight-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Archive, upload, and verify
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      BUG_REPORT_TOKEN: ${{ secrets.BUG_REPORT_TOKEN }}
      ASC_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
      INTERNAL_GROUP_ID: ${{ vars.TESTFLIGHT_INTERNAL_GROUP_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      IOS_SIGNING_CERTIFICATE_P12: ${{ secrets.IOS_SIGNING_CERTIFICATE_P12 }}
      IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
      IOS_SIGNING_INTERMEDIATES: ${{ secrets.IOS_SIGNING_INTERMEDIATES }}

    steps:
      - name: Check out the released commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate deployment configuration
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY BUG_REPORT_TOKEN ASC_APP_ID INTERNAL_GROUP_ID APPLE_TEAM_ID IOS_SIGNING_CERTIFICATE_P12 IOS_SIGNING_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE IOS_SIGNING_INTERMEDIATES; do
            if test -z "${!name}"; then
              echo "Missing required TestFlight configuration: $name" >&2
              exit 1
            fi
          done
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must point to a commit on main" >&2
            exit 1
          }
          python3 tools/validate-release.py --tag "$RELEASE_TAG"

      - name: Compute immutable build number
        id: version
        run: |
          version="$RELEASE_TAG"
          version="${version#v}"
          commit_count="$(git rev-list --count HEAD)"
          build_number="${commit_count}.${GITHUB_RUN_NUMBER}"
          echo "marketing_version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "Deploying Lillygram $version ($build_number)"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Run backend release gate
        run: uv run --directory backend --extra test pytest -q

      - name: Prepare App Store Connect credentials
        id: credentials
        run: |
          key_path="$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$(dirname "$key_path")"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "key_path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Prepare persistent signing identity
        id: signing
        run: |
          keychain_path="$RUNNER_TEMP/lillygram-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          certificate_path="$RUNNER_TEMP/lillygram-signing.p12"
          profile_source="$RUNNER_TEMP/lillygram.mobileprovision"
          intermediates_path="$RUNNER_TEMP/apple-wwdr-intermediates.pem"
          profile_directory="$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$IOS_SIGNING_CERTIFICATE_P12" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | /usr/bin/base64 -D > "$profile_source"

          printf '%s' "$IOS_SIGNING_INTERMEDIATES" | /usr/bin/base64 -D > "$intermediates_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$IOS_SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security import "$intermediates_path" \
            -k "$keychain_path" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          profile_uuid="$(security cms -D -i "$profile_source" | plutil -extract UUID raw -)"
          mkdir -p "$profile_directory"
          installed_profile="$profile_directory/$profile_uuid.mobileprovision"
          cp "$profile_source" "$installed_profile"

          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$profile_uuid" >> "$GITHUB_OUTPUT"
          echo "installed_profile=$installed_profile" >> "$GITHUB_OUTPUT"
          echo "certificate_path=$certificate_path" >> "$GITHUB_OUTPUT"
          echo "intermediates_path=$intermediates_path" >> "$GITHUB_OUTPUT"

      - name: Archive
        run: |
          xcodebuild \
            -project ios/Lillygram.xcodeproj \
            -scheme Lillygram \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Lillygram.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}" \
            BUG_REPORT_TOKEN="$BUG_REPORT_TOKEN" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${{ steps.signing.outputs.keychain_path }}" \
            archive

      - name: Verify archived metadata
        run: |
          plist="$RUNNER_TEMP/Lillygram.xcarchive/Products/Applications/Lillygram.app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "${{ steps.version.outputs.marketing_version }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "${{ steps.version.outputs.build_number }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :BugReportToken' "$plist")" = "$BUG_REPORT_TOKEN"

      - name: Write export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST

      - name: Export distribution-signed IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Lillygram.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.credentials.outputs.key_path }}" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        run: |
          xcrun altool \
            --upload-app \
            --file "$RUNNER_TEMP/export/Lillygram.ipa" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Wait for TestFlight availability
        run: |
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet 'PyJWT[crypto]'
          "$RUNNER_TEMP/asc-venv/bin/python" tools/wait-for-testflight.py \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-path "${{ steps.credentials.outputs.key_path }}" \
            --app-id "$ASC_APP_ID" \
            --group-id "$INTERNAL_GROUP_ID" \
            --build-number "${{ steps.version.outputs.build_number }}"

      - name: Publish deployment summary
        run: |
          {
            echo "### TestFlight deployment complete"
            echo "- Version: ${{ steps.version.outputs.marketing_version }}"
            echo "- Build: ${{ steps.version.outputs.build_number }}"
            echo "- App Store Connect processing: VALID"
            echo "- Internal tester group: available"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing credentials
        if: always()
        run: |
          rm -f "${{ steps.credentials.outputs.key_path }}"
          rm -f "${{ steps.signing.outputs.installed_profile }}"
          rm -f "${{ steps.signing.outputs.certificate_path }}"
          rm -f "${{ steps.signing.outputs.intermediates_path }}"
          if test -n "${{ steps.signing.outputs.keychain_path }}"; then
            security delete-keychain "${{ steps.signing.outputs.keychain_path }}" || true
          fi
          rmdir "$HOME/.private_keys" 2>/dev/null || true
